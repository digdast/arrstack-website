<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol: Stack of 3 Hexagons/Media Discs -->
  <g transform="translate(15, 10)">
    <!-- Base Layer -->
    <rect x="10" y="55" width="75" height="40" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M 25 75 L 70 75" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Middle Layer -->
    <rect x="15" y="32" width="75" height="40" rx="10" fill="#0F172A" stroke="url(#cyber-grad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="35" cy="52" r="5" fill="#06B6D4"/>
    <circle cx="52" cy="52" r="5" fill="#3B82F6"/>
    <circle cx="69" cy="52" r="5" fill="#8B5CF6"/>
    
    <!-- Top Floating Play Badge -->
    <rect x="25" y="10" width="75" height="40" rx="10" fill="url(#cyber-grad)"/>
    <polygon points="58,23 58,37 72,30" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Main Text -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      ARR<tspan fill="url(#cyber-grad)">STACK</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="2" y="76" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="2">
      ONE-SHOT MEDIA AUTOMATION SUITE
    </text>
    
    <!-- Verified Badge -->
    <rect x="360" y="30" width="75" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="397" y="44" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#34D399" text-anchor="middle" letter-spacing="0.5">
      v2.4 STABLE
    </text>
  </g>
</svg>
